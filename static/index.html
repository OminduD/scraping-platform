<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Scraping Platform</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <a class="brand" href="/static/index.html">Scraping Platform</a>
    <a href="/static/index.html" class="active">Home</a>
    <a href="/static/raw-scrape.html">Raw Scrape</a>
    <a href="/static/load-to-db.html">Load to DB</a>
  </nav>

  <div class="container">
    <h1>Dashboard</h1>

    <div class="card-grid" id="stats">
      <div class="card">
        <h2>Total Products</h2>
        <div class="stat" id="product-count">-</div>
        <div class="export-btns">
          <a href="/export/products/csv" class="btn">CSV</a>
          <a href="/export/products/tsv" class="btn">TSV</a>
          <a href="/export/products/psv" class="btn">PSV</a>
          <a href="/export/products/html" class="btn">HTML</a>
        </div>
      </div>
      <div class="card">
        <h2>Total Jobs</h2>
        <div class="stat" id="job-count">-</div>
        <div class="export-btns">
          <a href="/export/jobs/csv" class="btn">CSV</a>
          <a href="/export/jobs/tsv" class="btn">TSV</a>
          <a href="/export/jobs/psv" class="btn">PSV</a>
          <a href="/export/jobs/html" class="btn">HTML</a>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <h2>Raw Data Files</h2>
      <p class="meta">JSON files in data/raw (scraped without DB processing)</p>
      <div id="raw-files-list" class="loading">Loading...</div>
    </div>

    <div id="raw-preview-modal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="preview-modal-title">Preview</h2>
          <button class="modal-close" onclick="closePreviewModal()">&times;</button>
        </div>
        <p class="meta" id="preview-modal-meta"></p>
        <div id="preview-modal-body" class="modal-body"></div>
      </div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <h2>Recent Products (from DB)</h2>
      <div id="products-table" class="loading">Loading...</div>
    </div>

    <div class="card" style="margin-top: 1.5rem;">
      <h2>Recent Jobs (from DB)</h2>
      <div id="jobs-table" class="loading">Loading...</div>
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadStats();
      loadRawFiles();
      loadProducts();
      loadJobs();
    });

    async function loadStats() {
      try {
        const res = await fetch('/api/v1/analytics');
        const data = await res.json();
        document.getElementById('product-count').textContent = data.products_count || 0;
        document.getElementById('job-count').textContent = data.jobs_count || 0;
      } catch (e) {
        console.error('Failed to load stats:', e);
        document.getElementById('product-count').textContent = '0';
        document.getElementById('job-count').textContent = '0';
      }
    }

    async function loadRawFiles() {
      try {
        const res = await fetch('/api/v1/raw-files');
        const data = await res.json();
        const files = data.files || [];

        if (files.length === 0) {
          document.getElementById('raw-files-list').innerHTML = '<p class="meta">No raw files found. Use "Raw Scrape" to create some.</p>';
          return;
        }

        let html = '<table><thead><tr><th>File</th><th>Size</th><th>Modified</th><th>Actions</th></tr></thead><tbody>';
        for (const f of files) {
          const sizeKb = (f.size / 1024).toFixed(1);
          const modified = new Date(f.modified).toLocaleString();
          html += `<tr>
            <td>${escapeHtml(f.name)}</td>
            <td>${sizeKb} KB</td>
            <td>${modified}</td>
            <td>
              <button class="btn" onclick="loadPreview('${escapeHtml(f.name)}')">Preview</button>
              <a href="/export/raw/${encodeURIComponent(f.name)}/csv" class="btn">CSV</a>
              <a href="/export/raw/${encodeURIComponent(f.name)}/json" class="btn">JSON</a>
            </td>
          </tr>`;
        }
        html += '</tbody></table>';
        document.getElementById('raw-files-list').innerHTML = html;
      } catch (e) {
        document.getElementById('raw-files-list').innerHTML = '<p class="error">Failed to load raw files</p>';
      }
    }

    async function loadPreview(filename) {
      try {
        const res = await fetch(`/export/raw/${encodeURIComponent(filename)}/preview?limit=20`);
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || 'Failed to load preview');
        }

        const total = Number.isFinite(data.total) ? data.total : (Array.isArray(data.items) ? data.items.length : 0);
        const previewCount = Number.isFinite(data.preview_count) ? data.preview_count : (Array.isArray(data.items) ? data.items.length : 0);

        document.getElementById('preview-modal-title').textContent = `Preview: ${filename}`;
        document.getElementById('preview-modal-meta').textContent = `Showing ${previewCount} of ${total} items`;
        document.getElementById('preview-modal-body').innerHTML = renderRawDataTable(data.items || []);
        document.getElementById('raw-preview-modal').style.display = 'flex';
      } catch (e) {
        document.getElementById('preview-modal-title').textContent = `Preview: ${filename}`;
        document.getElementById('preview-modal-meta').textContent = 'Preview unavailable';
        document.getElementById('preview-modal-body').innerHTML = `<p class="meta">${escapeHtml(e.message)}</p>`;
        document.getElementById('raw-preview-modal').style.display = 'flex';
      }
    }

    function closePreviewModal() {
      document.getElementById('raw-preview-modal').style.display = 'none';
    }

    // Close modal on outside click
    document.getElementById('raw-preview-modal')?.addEventListener('click', (e) => {
      if (e.target.id === 'raw-preview-modal') {
        closePreviewModal();
      }
    });

    async function loadProducts() {
      try {
        const res = await fetch('/api/v1/products?limit=10');
        const data = await res.json();
        document.getElementById('products-table').innerHTML = renderProductsTable(data.items || []);
      } catch (e) {
        document.getElementById('products-table').innerHTML = '<p class="meta">No database connection or no products in DB</p>';
      }
    }

    async function loadJobs() {
      try {
        const res = await fetch('/api/v1/jobs?limit=10');
        const data = await res.json();
        document.getElementById('jobs-table').innerHTML = renderJobsTable(data.items || []);
      } catch (e) {
        document.getElementById('jobs-table').innerHTML = '<p class="meta">No database connection or no jobs in DB</p>';
      }
    }
  </script>
</body>
</html>
