# Logging configuration
version: 1
disable_existing_loggers: false

formatters:
  json:
    format: "%(message)s"

handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/app.log
    maxBytes: 10485760  # 10 MB
    backupCount: 5

root:
  level: INFO
  handlers: [console]

loggers:
  crawlers:
    level: DEBUG
  pipelines:
    level: INFO
  api:
    level: INFO
